apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: homework
  labels:
    app: web
spec:
  #securityContext:
  #  runAsUser: 0
  #  runAsGroup: 0
  #  fsGroup: 101
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      shareProcessNamespace: true
      containers:
      - name: nginx
        image: kyos0109/nginx-distroless
        securityContext:
          seccompProfile:
            type: Unconfined
        ports:
        - containerPort: 80
        volumeMounts:
        - name: empty-volume
          mountPath: /usr/share/nginx/html
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh","-c","rm /homework/index.html"]
        readinessProbe:
          httpGet:
            scheme: HTTP
            path: /index.html
            port: 80
      initContainers:
      - name: get-otus
        image: curlimages/curl
        command: ['sh', '-c', "curl -k https://otus.ru/nest/posts/ >> /init/index.html"]
        volumeMounts:
        - name: empty-volume
          mountPath: /init
      volumes:
      - name: empty-volume
        emptyDir: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: homework
spec:
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: web
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: "nginx"
  name: web
  namespace: homework
spec:
  ingressClassName: nginx
  rules:
  - host: sd-k8s4-debug.patio-minsk.by
    http:
      paths:
        - path: /
          pathType: ImplementationSpecific
          backend:
            service:
              name: web
              port:
                number: 80