loki:
  enabled: true
  isDefault: true
  url: http://{{(include "loki.serviceName" .)}}:{{ .Values.loki.service.port }}
  #readinessProbe:
  #  httpGet:
  #    path: /ready
  #    port: http-metrics
  #  initialDelaySeconds: 45
  #livenessProbe:
  #  httpGet:
  #    path: /ready
  #    port: http-metrics
  #  initialDelaySeconds: 45
  #datasource:
  #  jsonData: "{}"
  #  uid: ""
  schemaConfig:
    configs:
      - from: "2020-09-07"
        index:
          period: 24h
          prefix: loki_index_
        object_store: aws
        schema: v11
        store: boltdb-shipper
  storage:
    type: aws
    bucketNames:
      chunks: "otus-loki-hw"
    aws:
      access_key_id: ${SECRET_ID}
      bucketnames: 'otus-s3'
      endpoint: storage.yandexcloud.net
      http_config:
        idle_conn_timeout: 90s
        insecure_skip_verify: false
        response_header_timeout: 0s
      insecure: false
      region: ru-central1
      s3forcepathstyle: true
      secret_access_key: ${SECRET_KEY}
      sse_encryption: false
    boltdb_shipper:
      active_index_directory: /var/loki/index
      cache_location: /var/loki/cache
      cache_ttl: 168h
      shared_store: s3
  auth_enabled: false  
  ingester_client:
    grpc_client_config:
      grpc_compression: gzip
  #tracing:
  #  enabled: true
  #querier:
  #  max_concurrent: 4
  #singleBinary:
  #  replicas: 1
  #  nodeSelector: 
  #    node-role: infra
  tolerations: 
     - key: "node-role"
       operator: "Equal"
       value: "infra"
       effect: "NoSchedule"


promtail:
  enabled: true
  config:
    enabled: true
    #clients:
    #  - url: http://loki-gateway/loki/api/v1/push
  tolerations:
  - key: "node-role"
    operator: "Exists"
    effect: "NoSchedule"


grafana:
  enabled: true
  sidecar:
    datasources:
      label: ""
      labelValue: ""
      enabled: true
      maxLines: 1000
  image:
    tag: latest
  tolerations: 
    - key: "node-role"
      operator: "Equal"
      value: "infra"
      effect: "NoSchedule"